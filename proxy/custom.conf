fastcgi_read_timeout 120;
proxy_read_timeout 120;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
client_max_body_size 1024M;
# NOTE(krishan711): since we know this is not behind another proxy we force it
# to use the real ip address of the client.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Per-ip limits against request floods, only for hosts listed
# here (an empty key is not counted). Under http2 every open stream counts as a
# connection for limit_conn.
map $host $flood_limit_key {
    default "";
    ~(^|\.)yieldseeker\.xyz$ $binary_remote_addr;
}
limit_req_zone $flood_limit_key zone=per_ip_requests:10m rate=10r/s;
limit_conn_zone $flood_limit_key zone=per_ip_connections:10m;
limit_req zone=per_ip_requests burst=100 nodelay;
limit_conn per_ip_connections 64;
limit_req_status 429;
limit_conn_status 429;
http2_max_concurrent_streams 64;
